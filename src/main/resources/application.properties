spring.application.name=backend

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/sgtg}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:oracle}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
# update conserva los datos (la URL por defecto es la base de docker-compose); las pruebas usan create-drop
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Security configuration
#spring.security.user.name=${SPRING_SECURITY_USER_NAME:root}
#spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:root}
#spring.security.user.roles={ROLE_VIEWER}

# JWT configuration
# Clave (Base64, mínimo 32 bytes) con la que se firman los tokens; obligatoria, ver .env.example
jwt.secret=${JWT_SECRET}

# Prints the exact SQL queries to the console log
# SQL en el registro solo si se activa (SPRING_JPA_SHOW_SQL=true); los parámetros incluyen datos personales
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Carga por lotes: las colecciones y relaciones perezosas de varias entidades (los roles de los usuarios,
# las colecciones de los trabajos de grado) se traen en una consulta por lote y no en una por entidad
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Formats the printed console SQL output cleanly
spring.jpa.properties.hibernate.format_sql=true

# Highlights standard SQL commands in the console log via colors
spring.jpa.properties.hibernate.highlight_sql=true

# Logs the internal parameter bound variables used during execution
logging.level.org.hibernate.orm.jdbc.bind=${SGTG_LOG_PARAMETROS_SQL:info}

# Paso de migración de producción: crea o ajusta el esquema, pasa los datos y termina (ver SoloMigrar)
sgtg.solo-migrar=${SGTG_SOLO_MIGRAR:false}

# Sesión: el token de acceso dura poco y se renueva con el de renovación (cookie HttpOnly). La cookie es
# Secure: el navegador solo la envía por HTTPS o a localhost. Desactivarla solo para probar por HTTP fuera de
# localhost, nunca en producción
sgtg.sesion.minutos-token=${SGTG_MINUTOS_TOKEN:15}
sgtg.sesion.cookie-segura=${SGTG_COOKIE_SEGURA:true}

# Clave de los sellos de la auditoría (al menos 32 caracteres). Si no se define, se deriva de JWT_SECRET
sgtg.auditoria.clave=${SGTG_AUDITORIA_CLAVE:}
# Detección de alertas de seguridad (cada 5 minutos) y verificación nocturna de la auditoría y los archivos
sgtg.alertas.cron=${SGTG_ALERTAS_CRON:0 */5 * * * *}
sgtg.integridad.cron=${SGTG_INTEGRIDAD_CRON:0 30 3 * * *}
# Identificador de la petición (X-Request-Id) en cada línea del log
logging.pattern.level=%5p [%X{solicitud:-}]

# Costo de BCrypt para las contraseñas; los hashes con un costo menor se rehacen en el siguiente ingreso
sgtg.seguridad.bcrypt-costo=${SGTG_BCRYPT_COSTO:12}

# Administrador inicial (opcional): se crea al arrancar si se definen ambas variables
# Detrás de Nginx, la IP real del cliente (X-Forwarded-For) para la auditoría
server.forward-headers-strategy=${SGTG_FORWARD_HEADERS:native}
sgtg.admin.email=${SGTG_ADMIN_EMAIL:}
sgtg.admin.password=${SGTG_ADMIN_PASSWORD:}
sgtg.admin.documento=${SGTG_ADMIN_DOCUMENTO:1000000000}

# Verificación diaria de vencimientos (segundo minuto hora día mes día-semana), hora de Colombia
sgtg.vencimientos.cron=${SGTG_VENCIMIENTOS_CRON:0 5 0 * * *}

# Reloj ajustable para pruebas (endpoints /api/v1/sgtg/reloj). Nunca activar en producción
sgtg.reloj.ajustable=${SGTG_RELOJ_AJUSTABLE:false}

# Almacenamiento de los archivos de los trabajos de grado (solo PDF): <directorio>/<trabajoId>/<tipo>/v<n>/<archivo>
sgtg.archivos.directorio=${SGTG_ARCHIVOS_DIRECTORIO:./archivos}
spring.servlet.multipart.max-file-size=${SGTG_ARCHIVOS_TAMANO_MAXIMO:20MB}
# La solicitud de sustentación lleva hasta tres archivos
spring.servlet.multipart.max-request-size=${SGTG_ARCHIVOS_TAMANO_MAXIMO_PETICION:65MB}
