# Archivo de propiedades para mensajes de la aplicación
# Este archivo contiene mensajes que pueden ser utilizados en la aplicación para mostrar 
# información al usuario o para manejar errores.   

# Auth
error.auth.user_not_found=No se encontró un usuario con el correo proporcionado.
error.auth.invalid_credentials=Credenciales inválidas. Por favor, verifica tu correo y contraseña.
error.auth.register.valid.user.business_rule_violated=No se diligenció la información completa del usuario.
error.auth.register.valid.role.business_rule_violated=No se diligenció la información completa del usuario.

