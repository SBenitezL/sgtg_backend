# Configuración para pruebas: base de datos H2 en memoria (no requiere MySQL)
spring.application.name=backend

spring.datasource.url=jdbc:h2:mem:sgtg;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=5kMpK8pN2vQ9rX3sT6uW1yZ4aB7cD0eF3gH6iJ9lM2n5pOqRsT

# Sin administrador inicial en pruebas
sgtg.admin.email=
sgtg.admin.password=

# Archivos de las pruebas: dentro de target (se limpian con mvn clean) y en una carpeta nueva por contexto,
# para que no choquen con los de ejecuciones anteriores (la base H2 sí se reinicia)
sgtg.archivos.directorio=target/archivos-pruebas/${random.uuid}

# BCrypt con el costo mínimo para que las pruebas no tarden; en producción es 12
sgtg.seguridad.bcrypt-costo=4
# Los usuarios que crean las pruebas no tienen que cambiar la contraseña en el primer ingreso; las pruebas
# de ese cambio lo activan
sgtg.seguridad.cambio-password-obligatorio=false
