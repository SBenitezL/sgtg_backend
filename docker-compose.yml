services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: backend
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3307/sgtg?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: oracle
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: admin
      # Administrador inicial: se toma del archivo .env (ver .env.example)
      SGTG_ADMIN_EMAIL: ${SGTG_ADMIN_EMAIL:?Defina SGTG_ADMIN_EMAIL en el archivo .env (ver .env.example)}
      SGTG_ADMIN_PASSWORD: ${SGTG_ADMIN_PASSWORD:?Defina SGTG_ADMIN_PASSWORD en el archivo .env (ver .env.example)}
      # Entorno de desarrollo: reloj ajustable para probar flujos que dependen del tiempo (Thunder Client)
      SGTG_RELOJ_AJUSTABLE: ${SGTG_RELOJ_AJUSTABLE:-true}
      # Archivos de los trabajos de grado (PDF), en un volumen para que no se pierdan al recrear el contenedor
      SGTG_ARCHIVOS_DIRECTORIO: /app/archivos
    volumes:
      - archivos_data:/app/archivos
    depends_on:
      # Espera a que MySQL acepte conexiones, no solo a que el contenedor inicie
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: oracle
      MYSQL_DATABASE: sgtg
      MYSQL_TCP_PORT: 3307
    ports:
      - "3307:3307"
    command: --port=3307 --bind-address=0.0.0.0
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3307", "-uroot", "-poracle"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
  archivos_data:
